# Builds Habitat and publishes it to a GitHub Release.
#
# Tag a version to ship it:
#   npm version patch && git push --follow-tags
#
# electron-builder only builds here — publishing is one explicit step, because
# its own publisher uploads artifacts in parallel and each upload races to create
# the release, which ends up making two of them for the same tag.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Apple Silicon only — macos-latest runners are arm64.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      - name: Build
        run: npm run dist
        env:
          # Ad-hoc signed by scripts/adhoc-sign.cjs; no Developer ID involved.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Just the installer and the zip the self-updater downloads.
          FILES=(release/Habitat-*.dmg release/Habitat-*.zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "$TAG" --generate-notes
          fi
